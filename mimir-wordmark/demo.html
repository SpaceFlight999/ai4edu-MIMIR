<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIMIR · 流动字标</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#3d506c;font-family:"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:56px 32px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #d9dce1;padding-bottom:25px}.eyebrow{font-size:11px;letter-spacing:.22em}h1{font-family:Georgia,serif;font-size:28px;font-weight:400;margin:12px 0}p{color:#626c7e;line-height:1.8;font-size:14px}.hero{padding:100px 28px 72px;text-align:center}.hero mimir-wordmark{margin-bottom:40px}.caption{font-size:12px;letter-spacing:.12em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{padding:36px 24px;border:1px solid #dedfe3;background:white;border-radius:8px;min-width:0}.card.dark{background:#202b3e;color:#eaf0fa;border-color:#202b3e}.card.dark p{color:#b9c8dd}.card mimir-wordmark{display:block;margin:35px auto}footer{padding:30px 0;font-size:12px;color:#626c7e}.mini{margin-top:24px;padding:24px 0;display:flex;gap:32px;flex-wrap:wrap;align-items:center;border-top:1px solid #d9dce1}mimir-wordmark{max-width:100%}@media(max-width:600px){main{padding:28px 20px}.hero{padding:65px 0 40px}.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style><script type="module" src="./demo.mjs"></script></head><body><main>
<header><div><span class="eyebrow">MIMIR / WISDOM IN FLOW</span><h1>MIMIR · 原图纹样透明字标</h1></div></header>
<section class="hero"><mimir-wordmark width="720" theme="light"><img src="./svg/mimir-primary.svg" alt="MIMIR" width="720" style="max-width:100%;height:auto"></mimir-wordmark><p class="caption">胡须轻摆 · 书页慢翻 · 三树随风 · 水滴落下</p></section>
<div class="grid"><section class="card"><span class="eyebrow">01 / DAYLIGHT</span><mimir-wordmark width="480" theme="light"><img src="./svg/mimir-primary.svg" width="480" alt="MIMIR" style="max-width:100%;height:auto"></mimir-wordmark><p>点击老者捋须，点击书本加速翻页，点击右侧河流加速流淌；约 4 秒后自动恢复。</p></section><section class="card dark"><span class="eyebrow">02 / AFTER DARK</span><mimir-wordmark width="480" theme="dark"><img src="./svg/mimir-night.svg" width="480" alt="MIMIR" style="max-width:100%;height:auto"></mimir-wordmark><p>三棵树以不同节奏随风摇动，五个字母的纹样各自流动，水滴间歇下落。</p></section></div>
<section class="mini" aria-label="小尺寸字标"><mimir-wordmark width="160" theme="light">MIMIR</mimir-wordmark><mimir-wordmark width="240" theme="light">MIMIR</mimir-wordmark></section>
<footer>支持鼠标、键盘与触屏。聚焦字标后用左右方向键选择图案，回车播放，Escape 返回首页按钮。</footer>
</main></body></html>
